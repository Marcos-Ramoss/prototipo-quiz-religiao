spring.application.name=religious-quiz-api
server.port=${PORT:${SERVER_PORT:8080}}

# CORS Allowed Origins
quiz.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Configuração da IA (Gemini)
quiz.ai.provider=gemini
quiz.ai.gemini.api-key=${GEMINI_API_KEY:}
quiz.ai.gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest}
quiz.ai.gemini.timeout-seconds=${AI_TIMEOUT_SECONDS:45}

# Configurações de Sessão e Cache
quiz.session.ttl-minutes=${QUIZ_SESSION_TTL_MINUTES:60}

# Swagger / OpenAPI UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ==============================================================================
# Persistência Oficial com Supabase (PostgreSQL)
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração HikariCP otimizada para o Supabase Transaction Pooler e Render Free
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration


