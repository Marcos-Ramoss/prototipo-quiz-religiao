spring.application.name=religious-quiz-api-test
server.port=8080

# Banco H2 em memória simulando PostgreSQL nos testes
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# CORS e IA
quiz.cors.allowed-origins=http://localhost:4200
quiz.ai.provider=gemini
quiz.ai.gemini.api-key=
quiz.ai.gemini.model=gemini-flash-lite-latest
quiz.session.ttl-minutes=60

